<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swaapo Control Center</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap">
<style>
/* Control Center: same neon-on-deep-space language as the app. Dense tables, one action per button. */
:root{--bg:#04050D;--ink:#EAF6FF;--muted:#9AA8C7;--faint:#5F6B8C;--glass:rgba(90,140,255,.06);--glass2:rgba(110,170,255,.11);--line:rgba(120,200,255,.18);
  --cyan:#3DF5FF;--cyan-ink:#6FF7FF;--gold:#FFC857;--violet:#8B5CF6;--pink:#FF4FD8;--red:#FF3B6B;--ok:#3DF5D0;--on:#00151A;
  --display:"Plus Jakarta Sans",system-ui,sans-serif;--body:"Plus Jakarta Sans",system-ui,sans-serif;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#E9EEF8;--ink:#161A2B;--muted:#4F5873;--faint:#7A839C;--glass:rgba(255,255,255,.6);--glass2:rgba(255,255,255,.85);--line:rgba(0,90,140,.18);
  --cyan:#0096B4;--cyan-ink:#006B80;--gold:#B87900;--violet:#6D3CE0;--pink:#C0208F;--red:#D0204A;--ok:#007F86;--on:#fff;color-scheme:light}}
:root[data-theme="light"]{--bg:#E9EEF8;--ink:#161A2B;--muted:#4F5873;--faint:#7A839C;--glass:rgba(255,255,255,.6);--glass2:rgba(255,255,255,.85);--line:rgba(0,90,140,.18);
  --cyan:#0096B4;--cyan-ink:#006B80;--gold:#B87900;--violet:#6D3CE0;--pink:#C0208F;--red:#D0204A;--ok:#007F86;--on:#fff;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(60vw 50vh at 0 0,rgba(139,92,246,.22),transparent),radial-gradient(50vw 50vh at 100% 30%,rgba(0,200,255,.14),transparent),var(--bg);color:var(--ink);font:14px/1.5 var(--body);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:.04em;margin:0}
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:2px;overflow:auto}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;background:conic-gradient(from 180deg,#3DF5FF,#8B5CF6,#FF4FD8,#3DF5FF);box-shadow:0 0 16px rgba(61,245,255,.4)}
.logo b{font-family:var(--display);font-size:1.05rem;background:linear-gradient(90deg,var(--cyan-ink),var(--ink));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:.66rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:none;border:1px solid transparent;border-radius:12px;padding:9px 12px;font-weight:700;cursor:pointer}
nav button:hover{background:var(--glass2)}
nav button[aria-current="page"]{background:var(--glass2);border-color:var(--line);box-shadow:0 0 0 1px rgba(61,245,255,.2),0 0 18px rgba(61,245,255,.12)}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--pink);color:#fff;font-size:.7rem;display:grid;place-items:center}
.cnt:empty{display:none}
nav .who{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
main{padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px),3vw);padding-right:max(16px,env(safe-area-inset-right,0px),3vw);min-width:0}
.navlist{display:flex;flex-direction:column;gap:2px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:1.25rem;text-transform:uppercase}
.head p{margin:4px 0 0;color:var(--muted)}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(16px);padding:16px;margin-bottom:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.kpi{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi b{display:block;font-family:var(--body);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted)}
.kpi.warn b{color:var(--pink)}.kpi.gold b{color:var(--gold)}.kpi.cy b{color:var(--cyan-ink)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--glass2)}
.btn{border:1px solid var(--line);background:var(--glass2);border-radius:999px;padding:6px 13px;font-weight:800;font-size:.8rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--cyan)}
.btn.p{background:var(--cyan);color:var(--on);border:0;box-shadow:0 0 14px rgba(61,245,255,.3)}
.btn.g{background:var(--gold);color:#1A1000;border:0}
.btn.d{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.7rem;font-weight:800;border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--red);border-color:var(--red)}.pill.gold{color:var(--gold);border-color:var(--gold)}.pill.pink{color:var(--pink);border-color:var(--pink)}.pill.cy{color:var(--cyan-ink);border-color:var(--cyan)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-weight:700;font-size:.8rem;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--cyan);color:var(--on);border-color:var(--cyan)}
input,select,textarea{background:var(--glass2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.search{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.search input{flex:1;min-width:180px}
.muted{color:var(--muted)}.small{font-size:.8rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.field label{font-size:.75rem;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.sw input{width:20px;height:20px;accent-color:var(--cyan)}
.login{max-width:380px;width:calc(100% - 32px);margin:12vh auto;padding:26px}
.login h1{font-size:1.2rem;margin-bottom:4px}
.demo{border:1px dashed var(--gold);color:var(--ink);background:rgba(255,200,87,.08);border-radius:12px;padding:10px 12px;font-size:.82rem;margin-bottom:14px}.demo b{color:var(--gold)}
.err{color:var(--red);font-weight:700;font-size:.85rem;min-height:1.2em}
dialog{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:0;width:min(640px,calc(100vw - 32px));box-shadow:0 0 40px rgba(61,245,255,.15)}
dialog::backdrop{background:rgba(2,3,10,.65)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.db{padding:16px 18px;max-height:70vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--glass2);border:1px solid var(--cyan);padding:10px 18px;border-radius:999px;font-weight:700;backdrop-filter:blur(12px);z-index:9;box-shadow:0 0 18px rgba(61,245,255,.25)}
.toast.bad{border-color:var(--red)}
pre{white-space:pre-wrap;word-break:break-word;font-size:.75rem;margin:0;color:var(--muted)}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--bg)}
  nav{top:env(safe-area-inset-top,0px);z-index:10;height:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);overflow:visible}
  .logo{padding:0}
  nav .who{grid-column:2;grid-row:1;margin:0;padding:0;border:0;display:flex;align-items:center;gap:8px}
  nav .who .wn{display:none}
  nav .who .btn{margin:0!important}
  .navlist{grid-column:1/-1;flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:6px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px))}
  .navlist::-webkit-scrollbar{display:none}
  .navlist button{flex:none;border-color:var(--line);border-radius:999px;padding:7px 12px;font-size:.85rem}
  .head h2{font-size:1.05rem}
}
@media (max-width:640px){
  .tablewrap{overflow:visible}
  .tablewrap table,.tablewrap tbody,.tablewrap tr,.tablewrap td{display:block;width:100%}
  .tablewrap thead{display:none}
  .tablewrap tr{border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin-bottom:10px;background:var(--glass)}
  .tablewrap td{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:start;border-bottom:1px dashed var(--line);padding:8px 0;overflow-wrap:anywhere}
  .tablewrap td:last-child{border-bottom:0}
  .tablewrap .cell{min-width:0}
  .tablewrap td::before{content:attr(data-label);font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
  .tablewrap td[data-label=""]{grid-template-columns:1fr}.tablewrap td[data-label=""]::before{display:none}
  .panel{padding:14px;border-radius:16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi b{font-size:1.25rem}
  .dh,.db{padding-left:14px;padding-right:14px}
  pre{font-size:.7rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
h1,h2,h3{font-weight:800;letter-spacing:-.01em}.head h2{letter-spacing:.03em}

<body>
<div id="root"></div>
<dialog id="dlg"><div class="dh"><h3 id="dlg-t"></h3><button class="btn" id="dlg-x" aria-label="Close">✕</button></div><div class="db" id="dlg-b"></div></dialog>
<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=n=>"₹"+Math.round(n||0).toLocaleString("en-IN");
const num=n=>(n||0).toLocaleString("en-IN");
const when=s=>s?new Date(s.endsWith("Z")||s.includes("T")?s:s.replace(" ","T")+"Z").toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}):"—";
let TOKEN=null,ME=null,VIEW="dashboard",SUB={};
try{TOKEN=sessionStorage.getItem("swap-admin-token")}catch(_){}

async function api(method,path,body){
  if(window.SWAP_MOCK){try{return JSON.parse(JSON.stringify(await window.SWAP_MOCK(method,path,body,TOKEN)))}catch(e){if(e.status===401&&path!=="/auth/login")logout();throw e}}
  const r=await fetch("/api"+path,{method,headers:{"Content-Type":"application/json",...(TOKEN?{Authorization:"Bearer "+TOKEN}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&path!=="/auth/login"){logout();throw new Error("Session ended. Log in again.")}
  if(!r.ok)throw new Error(j.error||"Request failed");
  return j;
}
function toast(m,bad){const t=document.createElement("div");t.className="toast"+(bad?" bad":"");t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
async function act(fn,ok){try{await fn();if(ok)toast(ok);render()}catch(e){toast(e.message,true)}}
function dialog(title,html,onOpen){$("#dlg-t").textContent=title;$("#dlg-b").innerHTML=html;const d=$("#dlg");d.showModal();onOpen&&onOpen(d);return d}
$("#dlg-x").onclick=()=>$("#dlg").close();
// Asks for a short reason, then runs fn(reason). Every moderation action records why.
function ask(title,label,fn,{required=true,danger=false,placeholder=""}={}){
  dialog(title,`<form id="askf"><div class="field"><label for="ask-in">${esc(label)}</label><textarea id="ask-in" rows="3" placeholder="${esc(placeholder)}"></textarea></div><div class="err" id="ask-err"></div><div class="acts"><button class="btn ${danger?"d":"p"}" type="submit">Confirm</button></div></form>`,d=>{
    d.querySelector("#ask-in").focus();
    d.querySelector("#askf").onsubmit=e=>{e.preventDefault();const v=d.querySelector("#ask-in").value.trim();if(required&&!v){d.querySelector("#ask-err").textContent="Please add a reason.";return}d.close();act(()=>fn(v))}});
}
const isAdmin=()=>ME&&ME.role==="admin";
const tabs=(key,opts)=>`<div class="tabs" role="group">${opts.map(([v,l])=>`<button aria-pressed="${(SUB[key]??opts[0][0])===v}" data-sub="${key}" data-val="${v}">${l}</button>`).join("")}</div>`;
const sub=(key,def)=>SUB[key]??def;
function table(rows,cols,empty="Nothing here."){
  if(!rows.length)return `<p class="muted">${empty}</p>`;
  return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr${cols.rowAttr?cols.rowAttr(r):""}>${cols.map(c=>`<td data-label="${esc(c[0].replace(/<[^>]+>/g,""))}"><div class="cell">${c[1](r)}</div></td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

/* ---------- login ---------- */
function loginView(){
  $("#root").innerHTML=`<div class="panel login"><div class="logo" style="padding:0 0 14px"><div><span class="brandlogo" role="img" aria-label="Swaapo"></span><small>Control Center</small></div></div>
   <h1>Staff sign in</h1><p class="muted small">Moderators and admins only.</p>
   ${window.SWAP_DEMO?`<div class="demo" style="margin-top:12px">Demo with example data. Admin: <b>admin@swap.local</b> / <b>demo-admin</b>. Moderator: <b>mod.kochi</b> / <b>demo-mod</b>. Changes reset when you reload.</div>`:""}
   <form id="lf"><div class="field"><label for="l-u">Email or handle</label><input id="l-u" autocomplete="username" required value="${window.SWAP_DEMO?"admin@swap.local":""}"></div>
   <div class="field"><label for="l-p">Password</label><input id="l-p" type="password" autocomplete="current-password" required value="${window.SWAP_DEMO?"demo-admin":""}"></div>
   <div class="err" id="l-err"></div><button class="btn p" style="width:100%;padding:10px" type="submit">Sign in</button></form></div>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();$("#l-err").textContent="";
    try{const r=await api("POST","/auth/login",{login:$("#l-u").value,password:$("#l-p").value});TOKEN=r.token;const me=await api("GET","/me");
      if(me.role==="user"){TOKEN=null;throw new Error("This account isn't staff.")}
      try{sessionStorage.setItem("swap-admin-token",TOKEN)}catch(_){}
      ME=me;shell()}catch(err){$("#l-err").textContent=err.message}};
}
function logout(){TOKEN=null;ME=null;try{sessionStorage.removeItem("swap-admin-token")}catch(_){}loginView()}

/* ---------- shell ---------- */
const NAV=[["dashboard","Dashboard"],["users","Users"],["reports","Reports","reportsOpen"],["auctions","Auctions","auctionsPending"],["brands","Brands & bidders","brandsPending"],["studio","Studio & draws"],["ads","Ads","campaignsPending"],["content","Content"],["coins","Coins & Circle","circlePending"],["green","Swaapo Green"],["calls","Calls"],["settings","Settings"],["audit","Audit log"]];
let STATS={};
function shell(){
  $("#root").innerHTML=`<div class="wrap"><nav aria-label="Control Center"><div class="logo"><div><span class="brandlogo" role="img" aria-label="Swaapo"></span><small>Control Center</small></div></div>
   <div class="navlist">${NAV.map(([v,l,c])=>`<button data-view="${v}"><span>${l}</span>${c?`<span class="cnt" data-cnt="${c}"></span>`:""}</button>`).join("")}</div>
   <div class="who"><span class="wn"><b>${esc(ME.name)}</b> · ${esc(ME.role)}<br></span><button class="btn" style="margin-top:8px" id="out">Sign out</button></div></nav><main id="main"></main></div>`;
  $("#out").onclick=logout;render();
}
async function render(){
  document.querySelectorAll("nav [data-view]").forEach(b=>{b.setAttribute("aria-current",b.dataset.view===VIEW?"page":"false");if(b.dataset.view===VIEW&&matchMedia("(max-width:820px)").matches)b.scrollIntoView({block:"nearest",inline:"center"})});
  try{STATS=await api("GET","/admin/stats");document.querySelectorAll("[data-cnt]").forEach(el=>el.textContent=STATS[el.dataset.cnt]||"");
    await VIEWS[VIEW]($("#main"));if(window.SWAP_DEMO)$("#main").insertAdjacentHTML("afterbegin",`<div class="demo">Demo with example data: nothing here touches real members, and changes reset when you reload. The live Control Center runs on your Swaapo server at <b>/admin</b>.</div>`)}catch(e){$("#main").innerHTML=`<div class="panel"><b>Couldn't load.</b><p class="muted">${esc(e.message)}</p></div>`}
}
document.addEventListener("click",e=>{
  const v=e.target.closest("[data-view]");if(v){VIEW=v.dataset.view;render();return}
  const s=e.target.closest("[data-sub]");if(s){SUB[s.dataset.sub]=s.dataset.val;render();return}
});

     <div><button class="btn p" type="submit">Record batch</button> <span class="err" id="gb-err"></span></div></form></div>`:""}
   <div class="panel"><h3 class="small muted" style="margin-bottom:10px">DELIVERED BATCHES</h3>${table(g.batches,[["Date",b=>esc(b.happened_on)],["Type",b=>kindL[b.kind]],["Amount",b=>num(b.qty)+(b.kind==="cleanup"?" kg":"")],["Partner & place",b=>`${esc(b.partner)}<br><span class="small muted">${esc(b.location)}</span>`],["Proof",b=>`<a href="${esc(b.proof_url)}" target="_blank" rel="noopener" style="color:var(--cyan-ink)">Open</a>`],["By",b=>b.recorded_by?"@"+esc(b.recorded_by):"—"]],"Nothing recorded yet.")}</div>`;
  const f=m.querySelector("#gb");
  if(f)f.onsubmit=e=>{e.preventDefault();const v=id=>m.querySelector(id).value;
    act(()=>api("POST","/admin/impact/batches",{kind:v("#gb-kind"),qty:+v("#gb-qty"),partner:v("#gb-partner"),location:v("#gb-loc"),proofUrl:v("#gb-proof"),happenedOn:v("#gb-on")}),"Batch recorded.").catch(()=>{})};
 },
 async calls(m){
  const rows=await api("GET","/admin/calls");
  m.innerHTML=`<div class="head"><div><h2>Calls</h2><p>Call records only: who, when and how long. No audio or video is stored.</p></div></div>
   <div class="panel">${table(rows,[["When",c=>when(c.started_at)],["Caller",c=>"@"+esc(c.caller)],["Callee",c=>"@"+esc(c.callee)],["Type",c=>c.kind==="video"?"Video":"Voice"],["Length",c=>c.seconds!=null?`${Math.floor(c.seconds/60)}:${String(c.seconds%60).padStart(2,"0")}`:`<span class="pill cy">${c.status}</span>`]],"No calls yet.")}</div>`;
 },
 async settings(m){
  const s=await api("GET","/admin/settings"),ro=!isAdmin(),dis=ro?"disabled":"";
  const numFields=(key,obj,labels)=>Object.keys(obj).map(k=>`<div class="field"><label for="s-${key}-${k}">${labels[k]||k}</label><input id="s-${key}-${k}" type="number" min="0" data-k="${key}" data-f="${k}" value="${obj[k]}" ${dis}></div>`).join("");
  const F={exclusive:"Swaapo Exclusive (brand auctions)",signups:"New sign-ups",auctions:"Auctions",studio:"Pro Plus creator studio",draws:"Draws, giveaways, challenges, boxes",calls:"Voice & video calls",coins:"Swaapo Coins",circle:"Women's Circle",ads:"Ads",events:"Events",groups:"Groups"};
  m.innerHTML=`<div class="head"><div><h2>Settings</h2><p>${ro?"Read-only: only admins can change settings.":"Changes apply immediately for every member and are logged."}</p></div></div>
   <div class="grid2">
    <div class="panel"><h3 class="small muted">FEATURE SWITCHES</h3>${Object.keys(s.features).map(k=>`<label class="sw"><span>${F[k]||k}</span><input type="checkbox" data-feat="${k}" ${s.features[k]?"checked":""} ${dis}></label>`).join("")}</div>
    <div class="panel"><h3 class="small muted">MAINTENANCE MODE</h3><label class="sw"><span>Block all member actions (staff still work)</span><input type="checkbox" id="mt-on" ${s.maintenance.on?"checked":""} ${dis}></label>
     <div class="field" style="margin-top:10px"><label for="mt-msg">Message to members</label><textarea id="mt-msg" rows="2" ${dis}>${esc(s.maintenance.message)}</textarea></div>${ro?"":`<button class="btn p" id="mt-save">Save</button>`}</div>
    ${[["plans","PLAN PRICES (₹ / month)",{pro:"Pro",plus:"Pro Plus"}],["fees","SALE FEES (%)",{pro:"Pro",plus:"Pro Plus"}],["coins","SWAP COINS",{perFiveStar:"Coins per 5-star swap",unlockAt:"Unlock deals at",circleBonus:"Women's Circle bonus",welcomeBonus:"Welcome bonus (complete profile)"}],["trust","STARTING TRUST POINTS",{phone:"Mobile verified",email:"Email verified",id:"ID verified (Aadhaar or other)"}],
      ["limits","LIMITS",{minAge:"Minimum age to join",adultAge:"Age to see auctions & 18+ features",bidAge:"Age to bid and sell by auction",deleteGraceDays:"Days before a deletion is final",proAuctionsPerMonth:"Pro auctions per month",videoMaxSeconds:"Max video length (s)",boxMinValue:"Mystery box min value (₹)",antiSnipeSeconds:"Anti-snipe extension (s)"}],["impact","SWAP GREEN",{treesPerSwap:"Trees per completed swap",milestoneSwaps:"Milestone every N swaps",mealsPerMilestone:"Meals per milestone",cleanupsPerMilestone:"Clean-ups per milestone",co2KgPerSwap:"CO₂e kg per swap (estimate)",wasteKgPerSwap:"Waste kg per swap (estimate)"}]]
      .map(([k,t,l])=>`<div class="panel"><h3 class="small muted" style="margin-bottom:10px">${t}</h3>${numFields(k,s[k],l)}${ro?"":`<button class="btn p" data-save="${k}">Save</button>`}</div>`).join("")}
    <div class="panel"><h3 class="small muted" style="margin-bottom:10px">AD PRICES (₹ CPM)</h3>${numFields("cpm",s.ads.cpm,{feed:"Feed",story:"Story",side:"Side rail",auction:"Auction"})}${ro?"":`<button class="btn p" id="cpm-save">Save</button>`}</div>
    <div class="panel"><h3 class="small muted" style="margin-bottom:10px">SWAP EXCLUSIVE</h3><div class="field"><label for="x-fee">Brand sale fee (%)</label><input id="x-fee" type="number" min="0" value="${s.exclusive.feePct}" ${dis}></div>
     <label class="sw"><span>Only verified bidders can bid</span><input type="checkbox" id="x-kyc" ${s.exclusive.kycRequired?"checked":""} ${dis}></label>${ro?"":`<button class="btn p" id="x-save" style="margin-top:10px">Save</button>`}</div>
    <div class="panel"><h3 class="small muted" style="margin-bottom:10px">CATEGORIES</h3><div class="field"><label for="cats">One per line</label><textarea id="cats" rows="9" ${dis}>${esc(s.categories.join("\n"))}</textarea></div>${ro?"":`<button class="btn p" id="cats-save">Save</button>`}</div>
   </div>`;
  if(ro)return;
  const put=(k,v)=>act(()=>api("PUT","/admin/settings/"+k,{value:v}),"Saved.");
  const read=k=>Object.fromEntries([...m.querySelectorAll(`[data-k="${k}"]`)].map(i=>[i.dataset.f,Number(i.value)]));
  m.querySelectorAll("[data-feat]").forEach(c=>c.onchange=()=>put("features",{...s.features,...Object.fromEntries([...m.querySelectorAll("[data-feat]")].map(x=>[x.dataset.feat,x.checked]))}));
  $("#mt-save").onclick=()=>put("maintenance",{on:$("#mt-on").checked,message:$("#mt-msg").value.trim()||s.maintenance.message});
  m.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>put(b.dataset.save,read(b.dataset.save)));
  $("#x-save").onclick=()=>put("exclusive",{feePct:Number($("#x-fee").value),kycRequired:$("#x-kyc").checked});
  $("#cpm-save").onclick=()=>put("ads",{cpm:read("cpm")});
  $("#cats-save").onclick=()=>put("categories",$("#cats").value.split("\n").map(x=>x.trim()).filter(Boolean));
 },
 async audit(m){
  const rows=await api("GET","/admin/audit?limit=200");
  m.innerHTML=`<div class="head"><div><h2>Audit log</h2><p>Every staff action and every automatic sale, draw and plan change.</p></div></div><div class="panel">${auditTable(rows)}</div>`;
 },
};
const auditTable=rows=>table(rows,[["When",a=>when(a.created_at)],["Who",a=>a.actor?"@"+esc(a.actor):"<span class='muted'>system</span>"],["Action",a=>`<span class="pill">${esc(a.action)}</span>`],["Target",a=>esc(a.target||"")],["Details",a=>a.details?`<pre>${esc(a.details)}</pre>`:""]],"No activity yet.");

async function userDialog(id){
  let u;try{u=await api("GET","/admin/users/"+id)}catch(e){toast(e.message,true);return}
  const adm=isAdmin(),teen=u.age<18;
  dialog(`${u.name} · @${u.handle}`,`
   <p class="small muted">${esc(u.phone||"")}${u.email?" · "+esc(u.email)+(u.email_verified?" ✓":" (unverified)"):""} · ID ${u.id_verified?esc((u.id_method||"").replace(/_/g," "))+" ending "+esc(u.id_last4||"")+" ✓":"not verified"}${u.welcome_bonus?" · welcome bonus paid":""} · age ${u.age}${teen?" (teen)":""} · joined ${when(u.created_at)}${teen?`<br>Guardian: ${esc(u.guardian_contact||"none")}`:""}</p>
   <div class="kpis" style="margin:10px 0"><div class="kpi gold"><b>${num(u.coins)}</b><span>Coins</span></div><div class="kpi"><b>${u.trust}</b><span>Trust</span></div><div class="kpi"><b>${u.strikes}</b><span>Strikes</span></div><div class="kpi"><b>${u.posts.length}</b><span>Listings</span></div></div>
   <div class="acts" style="margin-bottom:14px">
     <button class="btn" data-u="verified" data-v="${u.verified?0:1}">${u.verified?"Remove verified":"✓ Mark verified"}</button>
     ${teen?`<button class="btn ${u.guardian_consent?"":"p"}" data-u="guardian_consent" data-v="${u.guardian_consent?0:1}">${u.guardian_consent?"Withdraw consent":"Confirm guardian consent"}</button>`:""}
     ${u.circle_status==="pending"?`<button class="btn p" data-u="circle_status" data-v="member">Approve Circle</button>`:u.circle_status==="member"?`<button class="btn" data-u="circle_status" data-v="none">Remove from Circle</button>`:""}
     ${u.kyc_status==="pending"?`<button class="btn p" data-u="kyc_status" data-v="verified">Approve bidder ID</button>`:u.kyc_status==="verified"?`<button class="btn" data-u="kyc_status" data-v="none">Remove verified bidder</button>`:""}
     ${u.banned?`<button class="btn" data-u="banned" data-v="0">Lift suspension</button>`:`<button class="btn d" id="ud-ban">Suspend</button>`}
   </div>
   ${u.banned?`<p class="err">Suspended: ${esc(u.ban_reason||"")}</p>`:""}
   ${adm?`<div class="grid2" style="gap:12px">
     <div class="field"><label for="ud-tier">Plan</label><select id="ud-tier" ${teen?"disabled":""}>${["free","pro","plus"].map(t=>`<option value="${t}" ${u.tier===t?"selected":""}>${{free:"Free",pro:"Pro",plus:"Pro Plus"}[t]}</option>`).join("")}</select>${teen?'<span class="small muted">Paid plans are 18+.</span>':""}</div>
     <div class="field"><label for="ud-role">Role</label><select id="ud-role" ${u.id===ME.id?"disabled":""}>${["user","moderator","admin"].map(t=>`<option ${u.role===t?"selected":""}>${t}</option>`).join("")}</select></div>
     <div class="field"><label for="ud-trust">Trust (0–100)</label><input id="ud-trust" type="number" min="0" max="100" value="${u.trust}"></div>
     <div class="field"><label for="ud-coins">Adjust coins (+/−)</label><div style="display:flex;gap:6px"><input id="ud-coins" type="number" placeholder="e.g. 100" style="flex:1"><input id="ud-cr" placeholder="Reason" style="flex:1.4"></div></div>
   </div><div class="acts"><button class="btn p" id="ud-save">Save plan, role &amp; trust</button><button class="btn g" id="ud-coin">Apply coins</button></div>`:`<p class="small muted">Plan, role, trust and coin changes need an admin.</p>`}
   <h3 class="small muted" style="margin:16px 0 8px">RECENT COINS</h3>${table(u.ledger.slice(0,8),[["When",l=>when(l.created_at)],["Change",l=>(l.delta>0?"+":"")+num(l.delta)],["Reason",l=>esc(l.reason)]],"None.")}`,d=>{
    const upd=(body,msg)=>{d.close();act(()=>api("PATCH","/admin/users/"+u.id,body),msg).then(()=>userDialog(u.id))};
    d.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const k=b.dataset.u,v=b.dataset.v;upd({[k]:k==="circle_status"||k==="kyc_status"?v:v==="1"},"Updated.")});
    const ban=d.querySelector("#ud-ban");if(ban)ban.onclick=()=>{d.close();ask("Suspend "+u.name,"Reason (shown to the member)",v=>api("PATCH","/admin/users/"+u.id,{banned:true,ban_reason:v}),{danger:true})};
    if(adm){
      d.querySelector("#ud-save").onclick=()=>{const body={trust:+d.querySelector("#ud-trust").value};const t=d.querySelector("#ud-tier").value,r=d.querySelector("#ud-role").value;
        if(t!==u.tier)body.tier=t;if(r!==u.role&&u.id!==ME.id)body.role=r;upd(body,"Saved.")};
      d.querySelector("#ud-coin").onclick=()=>{const delta=+d.querySelector("#ud-coins").value,reason=d.querySelector("#ud-cr").value.trim();
        if(!delta||!reason){toast("Add an amount and a reason.",true);return}d.close();act(()=>api("POST",`/admin/users/${u.id}/coins`,{delta,reason}),"Coins adjusted.").then(()=>userDialog(u.id))};
    }
  });
}

(async()=>{if(!TOKEN)return loginView();try{ME=await api("GET","/me");if(ME.role==="user")return logout();shell()}catch(_){loginView()}})();
</script>
