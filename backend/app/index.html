:root{--bg:#0B0D17;--surface:#141729;--surface-2:#1C2038;--line:rgba(255,255,255,.1);--ink:#F4F5FB;--muted:#A3A8C3;
  --brand:#7B3FF2;--brand-2:#4FA3F0;--yes:#2ED39A;--no:#FF5C7A;--gold:#FFC857;--warn-bg:rgba(255,92,122,.12);
  --logo:var(--logo-d);--radius:20px;--shadow:0 12px 40px rgba(0,0,0,.35);color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#F4F5FA;--surface:#FFFFFF;--surface-2:#EEF0F7;--line:rgba(16,20,45,.1);--ink:#14172B;--muted:#5D6382;--logo:var(--logo-l);--shadow:0 12px 40px rgba(20,23,43,.12);color-scheme:light}}
:root[data-theme="light"]{--bg:#F4F5FA;--surface:#FFFFFF;--surface-2:#EEF0F7;--line:rgba(16,20,45,.1);--ink:#14172B;--muted:#5D6382;--logo:var(--logo-l);--shadow:0 12px 40px rgba(20,23,43,.12);color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:block;height:26px;aspect-ratio:597/104;background:var(--logo) left center/contain no-repeat}
.mode{font-size:.7rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
main{flex:1;padding:16px 16px 110px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(528px,calc(100% - 24px));z-index:30;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:16px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:700;position:relative}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.tabs svg{width:22px;height:22px}
.badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--no);color:#fff;font-size:.66rem;font-weight:800;display:grid;place-items:center}
h1{font-size:1.45rem;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:1.1rem;margin:0}
.muted{color:var(--muted)}.small{font-size:.86rem}.xs{font-size:.75rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:11px 16px;font-weight:700;text-decoration:none;min-height:44px}
.btn.primary{background:linear-gradient(100deg,var(--brand-2),var(--brand));border-color:transparent;color:#fff}
.btn.yes{background:var(--yes);border-color:transparent;color:#05261A}
.btn.danger{color:var(--no)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--brand-2);font-weight:700;text-decoration:underline}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:.9rem}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px;min-height:46px}
.field textarea{resize:vertical;min-height:84px}
.count{align-self:flex-end;font-size:.72rem;color:var(--muted)}.count.over{color:var(--no);font-weight:800}
.err{color:var(--no);font-weight:700;font-size:.86rem;margin:0 0 12px}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--surface-2)}
/* swipe */
.deck{position:relative;height:min(68dvh,560px);margin:4px 0 18px}
.swipe{position:absolute;inset:0;border-radius:24px;overflow:hidden;background:var(--surface-2);box-shadow:var(--shadow);touch-action:pan-y;user-select:none;will-change:transform}
.swipe.back{transform:scale(.95) translateY(12px);opacity:.75;pointer-events:none}
.swipe img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.swipe .info{position:absolute;inset:auto 0 0 0;padding:70px 18px 18px;background:linear-gradient(transparent,rgba(5,6,14,.92));color:#fff}
.swipe .desc{font-size:1.2rem;font-weight:800;line-height:1.25;margin:0 0 8px}
.wants{display:inline-flex;gap:6px;align-items:baseline;background:rgba(255,255,255,.14);border-radius:12px;padding:6px 10px;font-size:.9rem}
.wants b{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.owner{display:flex;align-items:center;gap:10px;margin-top:12px;background:none;border:0;padding:0;color:#fff;text-align:left}
.likes-you{position:absolute;top:14px;left:14px;background:var(--gold);color:#2A1C00;font-weight:800;font-size:.75rem;padding:5px 10px;border-radius:999px}
.stamp{position:absolute;top:22px;padding:6px 14px;border:3px solid;border-radius:12px;font-weight:800;font-size:1.4rem;letter-spacing:.06em;opacity:0;transform:rotate(-12deg)}
.stamp.y{left:20px;color:var(--yes)}.stamp.n{right:20px;color:var(--no);transform:rotate(12deg)}
.choices{display:flex;justify-content:center;gap:28px}
.round{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.round svg{width:30px;height:30px}
.round.no{color:var(--no)}.round.yes{color:var(--yes)}
.hint{text-align:center;margin-top:10px}
/* people */
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;color:#fff;background:linear-gradient(135deg,var(--brand-2),var(--brand));flex:none}
.av.lg{width:76px;height:76px;font-size:1.5rem}
.stars{color:var(--gold);letter-spacing:1px}
/* items */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;overflow:hidden;padding:0;text-align:left}
.tile img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:var(--radius) var(--radius) 0 0}
.tile .tb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.pill{display:inline-block;font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.pill.ok{color:var(--yes)}.pill.warn{color:var(--gold)}.pill.bad{color:var(--no)}
.photo-pick{display:grid;place-items:center;gap:6px;aspect-ratio:4/3;border:2px dashed var(--line);border-radius:var(--radius);background:var(--surface-2) center/cover no-repeat;cursor:pointer;text-align:center;padding:16px;margin-bottom:14px;font-weight:700}
.photo-pick.has{border-style:solid}
.photo-pick.has span{display:none}
/* chats */
.row{display:flex;align-items:center;gap:12px;padding:12px;text-decoration:none;border-radius:16px}
.row:hover{background:var(--surface-2)}
.row .meta{flex:1;min-width:0}
.row .last{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb{width:48px;height:48px;border-radius:12px;object-fit:cover;flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--no);flex:none}
.chat{display:flex;flex-direction:column;gap:12px}
.pair{display:flex;align-items:center;justify-content:center;gap:10px}
.pair img{width:64px;height:64px;border-radius:14px;object-fit:cover}
.pair .x{font-weight:800;color:var(--muted)}
.plan{padding:14px;display:flex;flex-direction:column;gap:10px}
.plan dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
.plan dt{color:var(--muted);font-size:.8rem;font-weight:700}
.plan dd{margin:0;font-weight:600}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:120px}
.msg{max-width:80%;padding:10px 13px;border-radius:18px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:linear-gradient(100deg,var(--brand-2),var(--brand));color:#fff;border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.msg.sys{align-self:center;max-width:92%;background:none;color:var(--muted);font-size:.8rem;text-align:center;padding:4px 8px}
.msg .t{display:block;font-size:.66rem;opacity:.7;margin-top:4px}
.scam{align-self:stretch;background:var(--warn-bg);color:var(--no);border-radius:12px;padding:8px 12px;font-size:.8rem;font-weight:700}
.composer{position:sticky;bottom:96px;display:flex;gap:8px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.composer textarea{flex:1;border:0;background:none;resize:none;min-height:44px;max-height:140px;padding:10px}
.composer textarea:focus{outline:none}
.rate{display:flex;gap:6px}
.rate button{background:none;border:0;font-size:2rem;line-height:1;color:var(--muted);padding:2px}
.rate button[aria-pressed="true"]{color:var(--gold)}
/* profile */
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:20px 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:10px}
.stats div{background:var(--surface-2);border-radius:14px;padding:10px}
.stats b{display:block;font-size:1.2rem}
.review{padding:12px 0;border-top:1px solid var(--line)}
/* overlays */
.sheet-wrap{position:fixed;inset:0;z-index:60;background:rgba(5,6,14,.6);display:grid;align-items:end;justify-items:center;padding:12px}
@media (min-width:600px){.sheet-wrap{align-items:center}}
.sheet{width:min(520px,100%);max-height:90dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.sheet h2{margin-bottom:12px}
.match{text-align:center}
.match h2{font-size:1.8rem;background:linear-gradient(100deg,var(--brand-2),var(--brand),var(--no));-webkit-background-clip:text;background-clip:text;color:transparent}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;z-index:80;background:var(--ink);color:var(--bg);font-weight:700;padding:12px 16px;border-radius:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:800}
.auth{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:24px 20px;max-width:440px;margin:0 auto}
.auth .logo{height:40px}
.tagline{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps b.n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);flex:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
"use strict";
/* ============================================================
   Swaapo Core: list an item, swipe and match, chat, profile and rating.
   When this page is served by the Swaapo server it uses the real API (/api/core/*).
   Opened anywhere else, it runs a preview with example people, kept in this browser tab.
   ============================================================ */
const DESC_MAX = 140, WANTS_MAX = 80, MSG_MAX = 1000;
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const initials = n => String(n || "?").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function ago(iso) {
  const t = Date.parse(iso.includes("T") ? iso : iso.replace(" ", "T") + "Z"), s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return "just now"; if (s < 3600) return `${Math.floor(s / 60)} min ago`; if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  if (s < 30 * 86400) return `${Math.floor(s / 86400)} d ago`;
  return new Date(t).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
}
const when = iso => new Date(iso).toLocaleString("en-IN", { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
const joined = iso => new Date(iso.includes("T") ? iso : iso.replace(" ", "T") + "Z").toLocaleDateString("en-IN", { month: "long", year: "numeric" });
const starText = n => "★".repeat(n) + "☆".repeat(5 - n);
const ratingLine = p => p.rating == null ? (p.swaps ? `${p.swaps} swap${p.swaps === 1 ? "" : "s"}` : "New member") : `★ ${p.rating.toFixed(1)} · ${p.swaps} swap${p.swaps === 1 ? "" : "s"}`;
const ICON = {
  swipe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="17" rx="3"/><path d="M3 7v10M21 7v10"/></svg>',
  items: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><path d="M17.25 14v6.5M14 17.25h6.5"/></svg>',
  chats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  me: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  no: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  yes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6.5"/></svg>',
  camera: '<svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
};

/* ---------------- API: the real server ---------------- */
let TOKEN = store.get("swaapo-token");
async function http(method, path, body) {
  const r = await fetch("/api" + path, { method, headers: { "Content-Type": "application/json", ...(TOKEN ? { Authorization: "Bearer " + TOKEN } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => null);
  if (!r.ok) {
    if (r.status === 401 && TOKEN && !path.startsWith("/auth")) { signOut(); }
    throw Object.assign(new Error((j && j.error) || "Something went wrong. Try again."), { code: j && j.code, status: r.status });
  }
  return j;
}
const remote = {
  otpRequest: phone => http("POST", "/auth/otp/request", { phone }),
  otpVerify: (phone, code) => http("POST", "/auth/otp/verify", { phone, code, purpose: "login" }),
  signup: d => http("POST", "/auth/signup", d),
  login: (login, password) => http("POST", "/auth/login", { login, password }),
  me: () => http("GET", "/me"),
  updateMe: d => http("PATCH", "/me", d),
  myItems: () => http("GET", "/core/items/mine"),
  addItem: d => http("POST", "/core/items", d),
  removeItem: id => http("DELETE", `/core/items/${id}`),
  deck: () => http("GET", "/core/deck"),
  swipe: (itemId, dir) => http("POST", "/core/swipes", { itemId, dir }),
  matches: () => http("GET", "/core/matches"),
  match: id => http("GET", `/core/matches/${id}`),
  messages: (id, after) => http("GET", `/core/matches/${id}/messages?after=${after || 0}`),
  send: (id, text) => http("POST", `/core/matches/${id}/messages`, { text }),
  plan: (id, p) => http("POST", `/core/matches/${id}/plan`, p),
  confirmPlan: id => http("POST", `/core/matches/${id}/plan/confirm`, {}),
  done: id => http("POST", `/core/matches/${id}/done`, {}),
  cancel: (id, reason) => http("POST", `/core/matches/${id}/cancel`, { reason }),
  rate: (id, stars, note) => http("POST", `/core/matches/${id}/rating`, { stars, note }),
  user: handle => http("GET", `/core/users/${encodeURIComponent(handle)}`),
  summary: () => http("GET", "/core/summary"),
  seen: upTo => http("POST", "/core/notifications/seen", { upTo }),
  report: (type, id, reason) => http("POST", "/core/reports", { type, id, reason }),
};

/* ---------------- API: the in-browser preview ----------------
   Mirrors the server's rules (same limits, same match logic, ratings hidden until both rate)
   so the preview behaves like the real thing. Example people answer on their own. */
function makePreview() {
  const now = () => new Date().toISOString();
  const daysAgo = d => new Date(Date.now() - d * 864e5).toISOString();
  const pic = (emoji, a, b) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="600" height="800" fill="url(#g)"/><text x="300" y="400" font-size="260" text-anchor="middle" dominant-baseline="central">${emoji}</text></svg>`);
  const U = {
    you: { handle: "you", name: "You", area: "Kochi", bio: "", joined: now() },
    meera: { handle: "meera.swaps", name: "Meera Nair", area: "Kakkanad", bio: "Designer, plant parent. Will trade anything for books.", joined: daysAgo(210) },
    arjun: { handle: "arjun_m", name: "Arjun Menon", area: "Edappally", bio: "Cyclist and guitarist.", joined: daysAgo(160) },
    fatima: { handle: "fatima.reads", name: "Fatima Sheikh", area: "Fort Kochi", bio: "Swapping my shelf, one novel at a time.", joined: daysAgo(300) },
    rahul: { handle: "rahul.iyer", name: "Rahul Iyer", area: "Vyttila", bio: "Final-year B.Tech. Gadgets in, gadgets out.", joined: daysAgo(90) },
    sneha: { handle: "sneha.clicks", name: "Sneha Pillai", area: "Panampilly Nagar", bio: "Photographer.", joined: daysAgo(400) },
    anjali: { handle: "anjali.t", name: "Anjali Thomas", area: "Kaloor", bio: "Mom of two. Toys in rotation.", joined: daysAgo(120) },
  };
  // Earlier swaps between example people, so their profiles already carry ratings.
  const past = [["meera", 5, "Books exactly as described.", "fatima"], ["meera", 5, "Lovely to swap with.", "anjali"], ["arjun", 4, "A bit late, but a great swap.", "rahul"],
    ["fatima", 5, "Kind and on time.", "meera"], ["sneha", 5, "Camera gear was spotless.", "arjun"], ["sneha", 5, "Super easy.", "rahul"], ["rahul", 4, "Good swap.", "sneha"], ["anjali", 5, "Toys were clean and complete.", "meera"]];
  let seq = 100;
  const items = [
    ["meera", "🪴", "#2E8B57", "#0E4D3A", "Monstera deliciosa with a terracotta pot, 60 cm tall", "Novels or a bookshelf"],
    ["arjun", "🚲", "#3A7BD5", "#1B2A6B", "Btwin Rockrider MTB, 21 gears, serviced last month", "Acoustic guitar or a keyboard"],
    ["fatima", "📚", "#B5651D", "#4A2511", "Harry Potter box set, all 7 books, read once", "Headphones or a desk lamp"],
    ["rahul", "🎧", "#6A3AA0", "#24104A", "Sony WH-1000XM4, box and case, battery is great", "Bicycle or a smartwatch"],
    ["sneha", "📷", "#D9485F", "#5A1626", "Fujifilm X-T30 body, 3,100 shutter count", "Lenses or a laptop stand"],
    ["anjali", "🧸", "#E3A72F", "#7A4A00", "Big box of toys for ages 3–6, all clean and complete", "Kids' books or a scooter"],
    ["meera", "🪑", "#7B6F5C", "#2E2A22", "Teak study chair, solid and comfortable", "A floor lamp"],
    ["rahul", "⌚", "#2F4858", "#0D1A24", "Amazfit GTS 2 smartwatch, charger included", "Bluetooth speaker"],
  ].map(([u, e, a, b, desc, wants], i) => ({ id: ++seq, user: u, photo: pic(e, a, b), desc, wants, status: "active", createdAt: daysAgo(i * .7 + .1) }));
  const swipes = new Map(), matches = [], messages = [], ratings = [], notifs = [];
  // These example people say yes to anything you list, so your yes back becomes a match.
  const LIKERS = ["meera", "arjun", "rahul", "sneha"];
  const REPLIES = ["Sounds good! When are you free this week?", "Sure, I can meet near Lulu Mall or Vyttila Hub.", "Great, see you then. I'll bring it in the box.", "Perfect 👍"];
  let listeners = [];
  const emit = () => listeners.forEach(f => f());
  const err = (msg, code) => Promise.reject(Object.assign(new Error(msg), { code }));
  const later = (ms, fn) => setTimeout(() => { fn(); emit(); }, ms);
  const ok = v => new Promise(res => setTimeout(() => res(structuredClone(v)), 120));

  const itemOut = i => i && { id: i.id, photo: i.photo, desc: i.desc, wants: i.wants, status: i.status, createdAt: i.createdAt };
  function stats(u) {
    const swaps = past.filter(p => p[0] === u || p[3] === u).length + matches.filter(m => m.status === "completed" && (m.a === u || m.b === u)).length;
    const mine = past.filter(p => p[0] === u).map(p => p[1]).concat(ratings.filter(r => r.ratee === u && revealed(r)).map(r => r.stars));
    return { swaps, rating: mine.length ? Math.round(mine.reduce((a, b) => a + b, 0) / mine.length * 10) / 10 : null, ratings: mine.length };
  }
  const revealed = r => ratings.some(o => o.match === r.match && o.rater === r.ratee) || Date.now() - Date.parse(matches.find(m => m.id === r.match).completedAt) > 14 * 864e5;
  const person = u => ({ handle: U[u].handle, name: U[u].name, area: U[u].area, joined: U[u].joined, ...stats(u) });
  const key = h => Object.keys(U).find(k => U[k].handle === h);
  const side = (m, u) => (m.a === u ? "a" : "b");
  function matchOut(m) {
    const s = side(m, "you"), o = s === "a" ? "b" : "a", other = m[o];
    const last = messages.filter(x => x.match === m.id).at(-1);
    const mine = ratings.find(r => r.match === m.id && r.rater === "you");
    return { id: m.id, status: m.status, createdAt: m.createdAt, completedAt: m.completedAt, with: person(other),
      myItem: itemOut(items.find(i => i.id === m[s + "Item"])), theirItem: itemOut(items.find(i => i.id === m[o + "Item"])),
      plan: m.plan ? { ...m.plan, proposedByMe: m.planBy === "you", iConfirmed: !!m["ok" + s], theyConfirmed: !!m["ok" + o] } : null,
      iMarkedDone: !!m["done" + s], theyMarkedDone: !!m["done" + o], myRating: mine ? { stars: mine.stars, note: mine.note } : null,
      lastMessage: last ? { body: last.body, fromMe: last.sender === "you", system: last.sender === null, at: last.at } : null,
      unread: messages.filter(x => x.match === m.id && x.id > m["read" + s] && x.sender !== "you").length };
  }
  const msg = (match, sender, body, warn = false) => messages.push({ id: ++seq, match, sender, body, warn, at: now() });
  const notify = (kind, matchId, body) => notifs.push({ id: ++seq, kind, matchId, body, at: now(), seen: false });
  function makeMatch(myItem, theirItem) {
    const other = theirItem.user, m = { id: ++seq, a: "you", b: other, aItem: myItem.id, bItem: theirItem.id, status: "open", plan: null, planBy: null, oka: 0, okb: 0, donea: 0, doneb: 0, reada: 0, readb: 0, createdAt: now(), completedAt: null };
    matches.push(m);
    msg(m.id, null, "It's a match! You both said yes. Agree a place, a time and the condition of the items here.");
    later(1800, () => msg(m.id, other, `Hi! I'd love your ${myItem.desc.split(",")[0].toLowerCase()}. Mine is ready to swap whenever suits you.`));
    return m;
  }
  const getM = id => { const m = matches.find(x => x.id === +id); return m ? Promise.resolve(m) : err("Chat not found."); };

  return {
    preview: true,
    onChange: f => listeners.push(f),
    me: () => ok({ handle: "you", name: U.you.name, area: U.you.area, bio: U.you.bio, created_at: U.you.joined }),
    updateMe: d => { Object.assign(U.you, { name: d.name || U.you.name, area: d.area ?? U.you.area, bio: d.bio ?? U.you.bio }); return ok({ ok: true }); },
    myItems: () => ok(items.filter(i => i.user === "you" && i.status !== "removed").reverse().map(i => ({ ...itemOut(i), likes: [...swipes].filter(([k, d]) => d === "yes" && +k.split(":")[1] === i.id).length }))),
    addItem: d => {
      if (!d.photo) return err("Add a photo of the item.", "photo_required");
      if (!d.desc) return err("Add a short description.", "desc_required");
      if (d.desc.length > DESC_MAX) return err(`Keep the description to ${DESC_MAX} characters.`, "desc_too_long");
      if (!d.wants) return err("Say what you want in exchange.", "wants_required");
      if (d.wants.length > WANTS_MAX) return err(`Keep what you want to ${WANTS_MAX} characters.`, "wants_too_long");
      if (items.filter(i => i.user === "you" && i.status === "active").length >= 20) return err("You can list up to 20 items at a time.", "items_limit");
      const it = { id: ++seq, user: "you", photo: d.photo, desc: d.desc, wants: d.wants, status: "active", createdAt: now() };
      items.push(it);
      LIKERS.forEach((u, i) => later(600 + i * 400, () => swipes.set(`${u}:${it.id}`, "yes")));
      return ok(itemOut(it));
    },
    removeItem: id => { const i = items.find(x => x.id === +id && x.user === "you"); if (!i) return err("Item not found."); if (i.status === "swapped") return err("This item has been swapped, so it stays on your profile's history."); i.status = "removed"; return ok({ ok: true }); },
    deck: () => {
      const mine = items.filter(i => i.user === "you" && i.status === "active");
      if (!mine.length) return ok({ needItem: true, items: [] });
      const likesYou = u => mine.some(i => swipes.get(`${u}:${i.id}`) === "yes");
      const list = items.filter(i => i.user !== "you" && i.status === "active" && !swipes.has(`you:${i.id}`))
        .sort((a, b) => likesYou(b.user) - likesYou(a.user) || b.id - a.id)
        .map(i => ({ ...itemOut(i), likesYou: likesYou(i.user), owner: person(i.user) }));
      return ok({ needItem: false, items: list });
    },
    swipe: (itemId, dir) => {
      const it = items.find(i => i.id === +itemId && i.status === "active");
      if (!it) return err("That item is no longer available.", "item_gone");
      swipes.set(`you:${it.id}`, dir);
      if (dir !== "yes") return ok({ matched: null });
      const myLiked = items.find(i => i.user === "you" && i.status === "active" && swipes.get(`${it.user}:${i.id}`) === "yes" && !matches.some(m => m.status !== "cancelled" && m.aItem === i.id && m.bItem === it.id));
      if (!myLiked) return ok({ matched: null });
      const m = makeMatch(myLiked, it);
      notify("match", m.id, `You matched with ${U[it.user].name}.`);

    },

// Shrinks the photo on the phone before upload: max 1280 px, JPEG, under the server's 1.5 MB limit.
function compress(file) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error("Choose a photo."));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight; const max = 1280;
      if (Math.max(w, h) > max) { const s = max / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
      const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
      let q = .85, out = c.toDataURL("image/jpeg", q);
      while (out.length * .75 > 1.4 * 1024 * 1024 && q > .4) { q -= .1; out = c.toDataURL("image/jpeg", q); }
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("That photo couldn't be read. Try another.")); };
    img.src = url;
  });
}

  const el = $("#plan"); if (!el || !CHAT) return;
  const mt = CHAT.match, p = mt.plan, them = esc(mt.with.name.split(" ")[0]);
  let html = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>Swap plan</h2><span class="pill ${STATUS[mt.status][1]}">${STATUS[mt.status][0]}</span></div>`;
  if (p) html += `<dl><dt>Place</dt><dd>${esc(p.place)}</dd><dt>Time</dt><dd>${esc(when(p.time))}</dd><dt>Condition</dt><dd>${esc(p.condition)}</dd></dl>
    <p class="xs muted" style="margin:0">${p.iConfirmed ? "✓ You confirmed" : "You haven't confirmed"} · ${p.theyConfirmed ? `✓ ${them} confirmed` : `Waiting for ${them}`}</p>`;
  if (mt.status === "open") {
    html += p ? `<div style="display:flex;gap:8px;flex-wrap:wrap">${p.iConfirmed ? "" : '<button class="btn yes" data-plan-ok>Confirm plan</button>'}<button class="btn" data-plan>Suggest a change</button></div>`
      : `<p class="small muted" style="margin:0">Agree where and when to meet, and the condition of both items.</p><button class="btn primary" data-plan>Propose place, time and condition</button>`;
  } else if (mt.status === "agreed") {
    html += mt.iMarkedDone ? `<p class="small" style="margin:0">You marked the swap as done. Waiting for ${them} to confirm.</p>`
      : `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn yes" data-done>We've swapped</button><button class="btn" data-plan>Change plan</button></div>${mt.theyMarkedDone ? `<p class="small" style="margin:0">${them} says the swap is done. Confirm when you have the item.</p>` : ""}`;
  } else if (mt.status === "completed") {
    html += mt.myRating ? `<p class="small" style="margin:0">You rated ${them} <span class="stars">${starText(mt.myRating.stars)}</span>. Ratings show on profiles once you've both rated.</p>`
      : `<p class="small" style="margin:0"><b>How was swapping with ${them}?</b> Your rating builds trust for everyone.</p>
        <div class="rate" role="radiogroup" aria-label="Rating">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-star="${n}" aria-pressed="false" aria-label="${n} star${n > 1 ? "s" : ""}">★</button>`).join("")}</div>
        <div class="field" style="margin:0"><label for="rt-note" class="xs">Comment <span class="muted">(optional)</span></label><input id="rt-note" maxlength="300" placeholder="e.g. On time, item exactly as described"></div>
        <button class="btn primary" data-rate disabled>Submit rating</button>`;
  } else html += `<p class="small muted" style="margin:0">This swap was cancelled.</p>`;
  el.innerHTML = html;
  el.querySelectorAll("[data-plan]").forEach(b => b.onclick = () => planForm(mt));
  const act = async (fn, msg) => { try { CHAT.match = await fn(); renderPlan(); await pullMessages(); if (msg) toast(msg); } catch (x) { toast(x.message); } };
  el.querySelector("[data-plan-ok]")?.addEventListener("click", () => act(() => api.confirmPlan(mt.id), "Plan confirmed"));
  el.querySelector("[data-done]")?.addEventListener("click", () => { if (confirm(`Confirm you have ${them}'s item and they have yours?`)) act(() => api.done(mt.id)); });
  let stars = 0;
  el.querySelectorAll("[data-star]").forEach(b => b.onclick = () => { stars = +b.dataset.star; el.querySelectorAll("[data-star]").forEach(x => x.setAttribute("aria-pressed", +x.dataset.star <= stars)); el.querySelector("[data-rate]").disabled = false; });
  el.querySelector("[data-rate]")?.addEventListener("click", () => act(() => api.rate(mt.id, stars, $("#rt-note").value.trim()), "Thanks for rating"));
}
function planForm(mt) {
  const p = mt.plan, d = new Date(p ? p.time : Date.now() + 864e5);
  if (!p) d.setHours(17, 0, 0, 0);
  const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  const minLocal = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  const { w, close } = sheet(`<h2>Fix the exchange</h2>
    <form id="pf" novalidate><div class="field"><label for="pf-place">Place</label><input id="pf-place" maxlength="120" value="${esc(p ? p.place : "")}" placeholder="A busy public place, e.g. Lulu Mall main entrance"></div>
      <div class="field"><label for="pf-time">Date and time</label><input id="pf-time" type="datetime-local" min="${minLocal}" value="${local}"></div>
      <div class="field"><label for="pf-cond">Condition of both items</label><textarea id="pf-cond" maxlength="200" rows="3" placeholder="e.g. Guitar: new strings, small scratch. Bike: serviced, front brake pads new.">${esc(p ? p.condition : "")}</textarea></div>
      <p class="xs muted">Meet in daylight in a public place. Check the items before you swap.</p><p class="err" id="pf-err" hidden></p>
      <div style="display:grid;gap:10px"><button class="btn primary block" type="submit">Send to ${esc(mt.with.name.split(" ")[0])}</button><button class="btn block" type="button" data-close>Cancel</button></div></form>`, "Swap plan");
  w.querySelector("#pf").addEventListener("submit", async e => {
    e.preventDefault();
    const t = w.querySelector("#pf-time").value;
    try { CHAT.match = await api.plan(mt.id, { place: w.querySelector("#pf-place").value.trim(), time: t ? new Date(t).toISOString() : "", condition: w.querySelector("#pf-cond").value.trim() }); close(); renderPlan(); await pullMessages(); toast("Plan sent"); }
    catch (x) { fail(w.querySelector("#pf-err"), x); }
  });
}
function chatMenu(mt) {
  const open = !["completed", "cancelled"].includes(mt.status);
  const { w, close } = sheet(`<h2>${esc(mt.with.name)}</h2><div style="display:grid;gap:10px">
    <a class="btn block" href="#u/${esc(mt.with.handle)}" data-close>View profile</a>
    ${open ? '<button class="btn block danger" data-cancel>Cancel this swap</button>' : ""}
    <button class="btn block danger" data-report>Report ${esc(mt.with.name.split(" ")[0])}</button>
    <button class="btn block" data-close>Close</button></div>`, "Chat options");
  w.querySelector("[data-cancel]")?.addEventListener("click", async () => {
    const reason = prompt("Why are you cancelling? (optional)"); if (reason === null) return;
    try { CHAT.match = await api.cancel(mt.id, reason.trim()); close(); renderPlan(); await pullMessages(); } catch (x) { toast(x.message); }
  });
  w.querySelector("[data-report]").addEventListener("click", async () => {
    const reason = prompt("What happened? Our team reviews every report."); if (!reason || !reason.trim()) return;
    try { await api.report("user", mt.with.handle, reason.trim()); close(); toast("Thanks. We'll review this within 24 hours."); } catch (x) { toast(x.message); }
  });
}

/* ---------------- 4. Profile and rating ---------------- */
function profileHTML(p, mine) {
  return `<section class="card prof"><span class="av lg">${esc(initials(p.name))}</span><h1 style="margin:6px 0 0">${esc(p.name)}</h1>
    <span class="muted small">@${esc(p.handle)}${p.area ? " · " + esc(p.area) : ""} · Joined ${esc(joined(p.joined))}</span>
    ${p.bio ? `<p class="small" style="margin:6px 0 0">${esc(p.bio)}</p>` : ""}
    <div class="stats"><div><b>${p.swaps}</b><span class="xs muted">Swaps</span></div><div><b>${p.rating == null ? "–" : "★ " + p.rating.toFixed(1)}</b><span class="xs muted">Rating</span></div><div><b>${p.ratings}</b><span class="xs muted">Reviews</span></div></div>
    ${mine ? `<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center"><button class="btn" data-edit>Edit profile</button>${api.preview ? "" : '<button class="btn" data-out>Log out</button>'}</div>` : ""}</section>
    <h2 style="margin:20px 0 4px">Reviews</h2>
    ${p.reviews.length ? p.reviews.map(r => `<div class="review"><div style="display:flex;justify-content:space-between;gap:8px"><a href="#u/${esc(r.by.handle)}" style="font-weight:700;text-decoration:none">${esc(r.by.name)}</a><span class="stars" aria-label="${r.stars} out of 5">${starText(r.stars)}</span></div>${r.note ? `<p class="small" style="margin:4px 0 0">${esc(r.note)}</p>` : ""}<span class="xs muted">${esc(ago(r.at))}</span></div>`).join("")
      : `<p class="muted small">No reviews yet. Reviews appear after a completed swap, once both people have rated.</p>`}
    <h2 style="margin:20px 0 12px">${mine ? "Your items" : "Items"}</h2>
    ${p.items.length ? `<div class="grid">${p.items.map(i => `<article class="card tile"><img src="${esc(i.photo)}" alt="" loading="lazy"><div class="tb"><b class="small">${esc(i.desc)}</b><span class="xs muted">Wants: ${esc(i.wants)}</span></div></article>`).join("")}</div>` : '<p class="muted small">No items listed right now.</p>'}`;
}
async function vMe() {
  const m = shell("me", `<p class="muted">Loading…</p>`);
  ME = await api.me();
  const p = await api.user(ME.handle);
  m.innerHTML = profileHTML(p, true);
  m.querySelector("[data-out]")?.addEventListener("click", () => { if (confirm("Log out of Swaapo on this device?")) signOut(); });
  m.querySelector("[data-edit]").onclick = () => {
    const { w, close } = sheet(`<h2>Edit profile</h2><form id="ef" novalidate>
      <div class="field"><label for="ef-n">Name</label><input id="ef-n" maxlength="60" value="${esc(ME.name)}"></div>
      <div class="field"><label for="ef-a">Area</label><input id="ef-a" maxlength="60" value="${esc(ME.area || "")}" placeholder="e.g. Kakkanad, Kochi"></div>
      <div class="field"><label for="ef-b">About you</label><textarea id="ef-b" maxlength="300" rows="3" placeholder="What you like to swap">${esc(ME.bio || "")}</textarea></div>
      <p class="err" id="ef-err" hidden></p><div style="display:grid;gap:10px"><button class="btn primary block" type="submit">Save</button><button class="btn block" type="button" data-close>Cancel</button></div></form>`, "Edit profile");
    w.querySelector("#ef").addEventListener("submit", async e => {
      e.preventDefault(); const name = w.querySelector("#ef-n").value.trim();
      if (!name) return fail(w.querySelector("#ef-err"), new Error("Enter your name."));
      try { await api.updateMe({ name, area: w.querySelector("#ef-a").value.trim(), bio: w.querySelector("#ef-b").value.trim() }); close(); toast("Profile saved"); vMe(); }
      catch (x) { fail(w.querySelector("#ef-err"), x); }
    });
  };
}
async function vUser(handle) {
  if (ME && handle === ME.handle) { location.hash = "#me"; return; }
  const m = shell("", `<p class="muted">Loading…</p>`);
  try { const p = await api.user(handle); m.innerHTML = `<button class="btn" onclick="history.back()" aria-label="Back" style="padding:8px 10px;margin-bottom:12px">${ICON.back}</button>` + profileHTML(p, false); }
  catch (x) { m.innerHTML = `<div class="empty"><h2>${esc(x.message)}</h2><a class="btn" href="#swipe">Back</a></div>`; }
}

/* ---------------- Log in and sign up (real server only) ---------------- */
function vAuth() {
  clearInterval(POLL);
  app.innerHTML = `<div class="auth"><span class="logo" role="img" aria-label="Swaapo"></span>
    <p class="tagline">Don't Buy. Don't Sell.<br>Just Exchange.</p>
    <ol class="steps small"><li><b class="n">1</b><span><b>List</b> a photo, a short description and what you want.</span></li><li><b class="n">2</b><span><b>Swipe</b>. When you both say yes, it's a match.</span></li><li><b class="n">3</b><span><b>Chat</b> to fix the place, time and condition.</span></li><li><b class="n">4</b><span><b>Rate</b> each other after the swap.</span></li></ol>
    <form class="card" id="af" style="padding:18px" novalidate></form></div>`;
  const f = $("#af"); let phone = "";
  const step1 = () => {
    f.innerHTML = `<div class="field"><label for="af-ph">Mobile number</label><input id="af-ph" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="98765 43210"></div><p class="err" id="af-err" hidden></p><button class="btn primary block" type="submit">Send code</button>
      <p class="xs muted" style="text-align:center;margin:12px 0 0">Or <button type="button" class="linkbtn" id="af-pw">log in with a password</button></p>`;
    $("#af-pw").onclick = stepPw;
    f.onsubmit = async e => { e.preventDefault(); phone = $("#af-ph").value.replace(/\D/g, "");
      try { const r = await api.otpRequest(phone); step2(r.devCode); } catch (x) { fail($("#af-err"), x); } };
  };
  const step2 = devCode => {
    f.innerHTML = `<div class="field"><label for="af-c">Enter the 6-digit code sent to ${esc(phone)}</label><input id="af-c" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div>${devCode ? `<p class="xs muted">Development server: your code is <b>${esc(devCode)}</b>.</p>` : ""}<p class="err" id="af-err" hidden></p><button class="btn primary block" type="submit">Continue</button>`;
    f.onsubmit = async e => { e.preventDefault();
      try { const r = await api.otpVerify(phone, $("#af-c").value.trim()); if (r.token) return signedIn(r.token); step3(r.phoneTicket); } catch (x) { fail($("#af-err"), x); } };
  };
  const step3 = ticket => {
    f.innerHTML = `<h2 style="margin-bottom:12px">Create your profile</h2>
      <div class="field"><label for="su-n">Name</label><input id="su-n" maxlength="60" autocomplete="name"></div>
      <div class="field"><label for="su-h">Username</label><input id="su-h" maxlength="30" autocapitalize="off" placeholder="e.g. meera.swaps"></div>
      <div class="field"><label for="su-a">Area</label><input id="su-a" maxlength="60" placeholder="e.g. Kakkanad, Kochi"></div>
      <div class="field"><label for="su-d">Date of birth</label><input id="su-d" type="date"></div>
      <div class="field" id="su-gw" hidden><label for="su-g">Parent or guardian's phone or email</label><input id="su-g" maxlength="120"><span class="xs muted">Members under 18 need a parent or guardian to confirm the account.</span></div>
      <div class="field"><label for="su-p">Password</label><input id="su-p" type="password" autocomplete="new-password" minlength="8"><span class="xs muted">At least 8 characters.</span></div>
      <p class="err" id="af-err" hidden></p><button class="btn primary block" type="submit">Join Swaapo</button>`;
    $("#su-d").addEventListener("change", () => { const y = (Date.now() - Date.parse($("#su-d").value)) / (365.25 * 864e5); $("#su-gw").hidden = !(y < 18); });
    f.onsubmit = async e => { e.preventDefault();
      try { const r = await api.signup({ name: $("#su-n").value.trim(), handle: $("#su-h").value.trim(), area: $("#su-a").value.trim(), dob: $("#su-d").value, guardianContact: $("#su-g").value.trim(), password: $("#su-p").value, phoneTicket: ticket }); signedIn(r.token); }
      catch (x) { fail($("#af-err"), x); } };
  };
  const stepPw = () => {
    f.innerHTML = `<div class="field"><label for="lp-l">Username or mobile</label><input id="lp-l" autocomplete="username"></div><div class="field"><label for="lp-p">Password</label><input id="lp-p" type="password" autocomplete="current-password"></div><p class="err" id="af-err" hidden></p><button class="btn primary block" type="submit">Log in</button>
      <p class="xs muted" style="text-align:center;margin:12px 0 0"><button type="button" class="linkbtn" id="af-otp">Use a mobile code instead</button></p>`;
    $("#af-otp").onclick = step1;
    f.onsubmit = async e => { e.preventDefault(); try { const r = await api.login($("#lp-l").value.trim(), $("#lp-p").value); signedIn(r.token); } catch (x) { fail($("#af-err"), x); } };
  };
  step1();
}
function signedIn(token) { TOKEN = token; store.set("swaapo-token", token); start(); }
function signOut() { TOKEN = null; store.set("swaapo-token", null); ME = null; CHAT = null; vAuth(); }

/* ---------------- Router, notifications, start-up ---------------- */
async function route() {
  if (!api.preview && !TOKEN) return vAuth();
  const [view, arg] = location.hash.slice(1).split("/");
  if (view !== "chat") CHAT = null;
  try {
    if (view === "list") return vList();
    if (view === "items") return await vItems();
    if (view === "chats") return await vChats();
    if (view === "chat") return await vChat(arg);
    if (view === "me") return await vMe();
    if (view === "u") return await vUser(decodeURIComponent(arg || ""));
    return await vSwipe();
  } catch (x) { if (x.status !== 401) $("#main") ? ($("#main").innerHTML = `<div class="empty"><h2>${esc(x.message)}</h2><button class="btn" onclick="route()">Try again</button></div>`) : toast(x.message); }
}
async function poll() {
  if (!api.preview && !TOKEN) return;
  try {
    const s = await api.summary();
    if (s.unread !== UNREAD) { UNREAD = s.unread; const a = document.querySelector('.tabs a[href="#chats"]'); if (a) { a.querySelector(".badge")?.remove(); if (UNREAD) a.insertAdjacentHTML("beforeend", `<span class="badge" aria-label="${UNREAD} unread">${UNREAD > 99 ? "99+" : UNREAD}</span>`); } }
    const fresh = s.notifications.filter(n => n.id > LAST_NOTIF);
    if (fresh.length) {
      LAST_NOTIF = Math.max(...fresh.map(n => n.id));
      const n = fresh.at(-1), inThisChat = CHAT && n.matchId === CHAT.id;
      if (!inThisChat) toast(n.body, n.matchId ? { label: "Open", run: () => (location.hash = "#chat/" + n.matchId) } : null);
      api.seen(LAST_NOTIF);
      if (location.hash === "#chats") vChats();
    }
    // An empty deck checks for newly listed items.
    const v = location.hash.slice(1).split("/")[0];
    if ((!v || v === "swipe") && !DECK.length && !document.querySelector(".sheet-wrap")) { const d = await api.deck(); if (d.items.length) { DECK = d.items; renderDeck(); } }
    if (CHAT) {
      await pullMessages();
      // Refresh the plan card only when something on it changed, so a half-typed rating isn't wiped.
      const fresh2 = await api.match(CHAT.id), sig = m => JSON.stringify([m.plan, m.status, m.iMarkedDone, m.theyMarkedDone, m.myRating]);
      if (CHAT && sig(fresh2) !== sig(CHAT.match)) { CHAT.match = fresh2; renderPlan(); }
    }
  } catch {}
}
document.addEventListener("keydown", e => {
  const v = location.hash.slice(1).split("/")[0];
  if (v && v !== "swipe") return;
  if (document.querySelector(".sheet-wrap") || /INPUT|TEXTAREA/.test(document.activeElement?.tagName)) return;
  if (e.key === "ArrowRight") decide("yes"); if (e.key === "ArrowLeft") decide("no");
});
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); route(); });
// Tapping the tab you're already on refreshes it.
document.addEventListener("click", e => { const a = e.target.closest(".tabs a"); if (a && a.getAttribute("href") === (location.hash || "#swipe")) { e.preventDefault(); route(); } });
function start() {
  clearInterval(POLL);
  route();
  POLL = setInterval(poll, api.preview ? 1500 : 4000);
  poll();
}
(async function boot() {
  // Use the real server when this page is served by it; otherwise run the in-browser preview.
  let live = false;
  if (location.protocol.startsWith("http")) {
    try { const c = new AbortController(); setTimeout(() => c.abort(), 2500); const r = await fetch("/api/health", { signal: c.signal }); live = r.ok && /Swaapo/.test((await r.json()).name || ""); } catch {}
  }
  if (!live) { api = makePreview(); api.onChange(() => { if (location.hash === "#chats") vChats(); }); }
  start();
})();
</script>
